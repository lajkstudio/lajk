<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Ügyfélszolgálat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="icon" href="favicon_io/favicon.ico" type="image/x-icon">
    <link rel="manifest" href="favicon_io/site.webmanifest">
</head>
<style>
    body{
        background-image: url("fohatter.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }
    #logo{
        width: 90px;
        height: 90px;
    }
</style>
<body class="bg-warning bg-opacity-10 min-vh-100 d-flex flex-column">

    <header class="bg-white border-bottom border-warning border-opacity-25 py-3 mb-4 shadow-sm">
        <div class="container-fluid px-3 px-md-5 d-flex justify-content-between align-items-center">
            <a href="#" class="navbar-brand fs-3 fw-bold text-dark text-decoration-none d-flex align-items-center gap-2">
                <img src="logo.jpg" alt="logo" id="logo"><span>LIKE</span>
            </a>
            <div>
                <a href="#" class="fw-bold text-dark text-decoration-none fs-6">Ügyfélszolgálat</a>
            </div>
        </div>
    </header>

    <main class="container-fluid px-3 px-md-5 mb-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8 col-xl-7">
                <div class="card border border-warning border-opacity-50 rounded-5 shadow-sm p-3 p-md-4 bg-white">
                    
                    <div class="bg-warning text-dark text-center py-3 rounded-4 fw-bold fs-3 mb-4 shadow-sm">
                        Ügyfélszolgálat
                    </div>

                    <div id="alertBox" class="alert alert-success d-none mb-4 rounded-4" role="alert">
                        Köszönjük a megkeresést! Ügyfélszolgálatunk hamarosan felveszi Önnel a kapcsolatot.
                    </div>

                    <form id="contactForm">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-semibold text-secondary small ms-2">Email cím</label>
                                <input type="email" class="form-control rounded-pill border-warning border-opacity-50 px-3 py-2" id="email" required>
                            </div>
                            <div class="col-md-6">
                                <label for="phone" class="form-label fw-semibold text-secondary small ms-2">Telefonszám</label>
                                <div class="input-group">
                                    <select class="form-select rounded-start-pill border-warning border-opacity-50 px-3 py-2 w-auto flex-grow-0" id="countryCode">
                                        <option value="+36">+36 (HU)</option>
                                        <option value="+43">+43 (AT)</option>
                                        <option value="+49">+49 (DE)</option>
                                        <option value="+40">+40 (RO)</option>
                                        <option value="+421">+421 (SK)</option>
                                        <option value="+380">+380 (UA)</option>
                                    </select>
                                    <input type="tel" class="form-control rounded-end-pill border-warning border-opacity-50 px-3 py-2" id="phone" placeholder="12 345 6789" required>
                                </div>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="issueType" class="form-label fw-semibold text-secondary small ms-2">Milyen problémába ütközött?</label>
                                <select class="form-select rounded-pill border-warning border-opacity-50 px-3 py-2" id="issueType" required>
                                    <option value="" selected disabled>Válasszon opciót...</option>
                                    <option value="csomag">Probléma a csomaggal / szállítással</option>
                                    <option value="serult">Sérült vagy hibás terméket kaptam</option>
                                    <option value="nem_az">Nem azt kaptam, amit rendeltem</option>
                                    <option value="csere">Méret- vagy termékcsere kérelem</option>
                                    <option value="fizetes">Fizetéssel kapcsolatos kérdés</option>
                                    <option value="egyeb">Egyéb észrevétel / kérdés</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="trackingNumber" class="form-label fw-semibold text-secondary small ms-2">Csomagazonosító / Rendelésszám</label>
                                <input type="text" class="form-control rounded-pill border-warning border-opacity-50 px-3 py-2" id="trackingNumber" placeholder="Pl.: LK-12345678" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label for="message" class="form-label fw-semibold text-secondary small ms-2 mb-0">Írjon bővebben a problémájáról:</label>
                                <small class="text-muted me-2"><span id="charCount">0</span> / 500 karakter</small>
                            </div>
                            <textarea class="form-control rounded-4 border-warning border-opacity-50 p-3" id="message" rows="5" maxlength="500" required></textarea>
                        </div>

                        <div class="d-flex justify-content-center">
                            <button type="submit" class="btn btn-warning rounded-pill px-5 py-2 fw-bold shadow-sm fs-5 text-dark">Küldés</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </main>

    <script>
        const messageInput = document.getElementById('message');
        const charCount = document.getElementById('charCount');
        const contactForm = document.getElementById('contactForm');
        const alertBox = document.getElementById('alertBox');

        messageInput.addEventListener('input', function () {
            charCount.textContent = this.value.length;
        });

        contactForm.addEventListener('submit', function (e) {
            e.preventDefault();
            alertBox.classList.remove('d-none');
            contactForm.reset();
            charCount.textContent = '0';
        });
    </script>

  
</body>
</html>
